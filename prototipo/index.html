:root{

  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ecf8;

}

:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface2:#1d2633; --ink:#e5eaf2; --muted:#9aa6b8; --line:#2c3848;
  --accent:#86b4f0; --accent-ink:#0f141b; --accent-soft:#1f2f47;
  --q-red:#f08b80; --q-yellow:#e6b84d; --q-blue:#86b4f0; --q-green:#6fd09b; --q-grey:#a3adbb;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;letter-spacing:.02em}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-family:var(--font-d);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{font-family:var(--font-b);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.perfil{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5}

.demo{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);font-size:13px}
.demo .wrap{padding-block:7px}
main.wrap{padding-block:18px 48px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel>h2{margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field{display:grid;gap:3px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-align:left;font-weight:500}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.card b{font-family:var(--font-d);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.card span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.matrix .ax{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px}
.q{border:1px solid transparent;border-radius:6px;padding:12px 10px;cursor:pointer;text-align:left;display:grid;gap:2px;min-height:74px}
.q b{font-family:var(--font-d);font-size:22px}
.q small{font-size:12px}
.q.sel{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.c-VERMELHO{background:var(--q-red-bg);color:var(--q-red)} .c-AMARELO{background:var(--q-yellow-bg);color:var(--q-yellow)}
.c-AZUL{background:var(--q-blue-bg);color:var(--q-blue)} .c-VERDE{background:var(--q-green-bg);color:var(--q-green)}
.c-CINZA{background:var(--q-grey-bg);color:var(--q-grey)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.n{background:var(--q-grey-bg);color:var(--q-grey)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--surface2)}
.fita{display:inline-flex;gap:2px;vertical-align:middle}
.fita i{width:9px;height:14px;border-radius:2px;display:block;background:var(--q-green)}
.fita i.neg{background:var(--q-red)} .fita i.none{background:transparent;border:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:12px}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:13px}
.block{background:var(--q-red-bg);color:var(--q-red);border:1px solid currentColor;border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.ok{background:var(--q-green-bg);color:var(--q-green);border:1px solid currentColor;border-radius:6px;padding:10px 12px}

.head{display:grid;gap:6px}
.head h1{font-size:20px}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tl{display:grid;gap:0}
.tl div{display:grid;grid-template-columns:86px 120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.tl div{grid-template-columns:70px 1fr}.tl div span:last-child{grid-column:1/-1}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.ph .img{height:110px;background:repeating-linear-gradient(0deg,var(--surface2) 0 22px,var(--line) 22px 25px),var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.ph .cap{padding:8px 10px;font-size:12px;display:grid;gap:2px}

.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.steps span.done{background:var(--q-green-bg);color:var(--q-green);border-color:transparent}
.steps span.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ponto{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:8px}
.checks{display:grid;gap:4px;font-size:13px}
.checks .bad{color:var(--q-red);font-weight:600} .checks .good{color:var(--q-green)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px clamp(16px,5vw,44px);max-width:820px;display:grid;gap:14px}
.doc h3{font-size:14px;margin-top:6px}
.doc .cab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.doc .rod{border-top:1px solid var(--line);padding-top:8px;font-size:11px;color:var(--muted)}
.doc p{margin:0;max-width:68ch}
.bars{display:grid;gap:5px}
.bars div{display:grid;grid-template-columns:54px 1fr 46px;gap:8px;align-items:center;font-size:12px}
.bars i{display:block;height:12px;background:var(--line);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.q,.btn,.seg button{transition:background-color .12s}}
</style>

function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function build(b){

var ROTAS=[["painel","Painel"],["ficha","Ficha do colaborador"],["emissao","Emissão"]];
function rota(){var r=location.hash.replace("#","");return ROTAS.some(function(x){return x[0]===r})?r:"painel"}
function render(){var r=rota();
  document.getElementById("nav").innerHTML=ROTAS.map(function(x){return '<a href="#'+x[0]+'" class="'+(r===x[0]?"on":"")+'"'+(r===x[0]?' aria-current="page"':"")+'>'+x[1]+'</a>'}).join("");
  document.getElementById("app").innerHTML=r==="painel"?vPainel():r==="ficha"?vFicha():vEmissao()}
function go(r){if(rota()===r)render();else location.hash=r;window.scrollTo(0,0)}
window.addEventListener("hashchange",render);

document.getElementById("perfil").addEventListener("change",function(ev){S.perfil=ev.target.value;S.fSup="";S.fReg="";S.fQuad="";var p=P();if(p.escopo&&byM(S.colab).sup!==p.escopo)S.colab=escopo()[0].m;render()});
document.addEventListener("change",function(ev){var t=ev.target,f=t.getAttribute("data-f");
  if(f==="fSup"||f==="fReg"){S[f]=t.value;render()}
  else if(f==="colab"){S.colab=t.value;S.em=null;render()}
  else if(f==="tipo"){S.em.relato=document.getElementById("relato").value;S.em.tipo=t.value;render()}
  else if(t.hasAttribute("data-conc")){S.em.pontos[+t.getAttribute("data-conc")].conc=+t.value}
  else if(t.hasAttribute("data-out")){S.em.outras[+t.getAttribute("data-out")].on=t.checked}});
document.addEventListener("input",function(ev){var t=ev.target;
  if(t.hasAttribute("data-txt")){S.em.pontos[+t.getAttribute("data-txt")].txt=t.value;document.getElementById("rev").innerHTML=revHtml();document.getElementById("btnRev").disabled=!revisar().ok}
  else if(t.id==="relato"){S.em.relato=t.value}});
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),v=b.getAttribute("data-v"),e=S.em,c=byM(S.colab),p=P();
  if(a==="visao"){S.visao=v;render()}
  else if(a==="quad"){S.fQuad=S.fQuad===v?"":v;render()}
  else if(a==="rank"){S.rank=v;render()}
  else if(a==="aba"){S.aba=v;render()}
  else if(a==="abrir"){S.colab=v;S.em=null;S.aba=p.abas[0];go("ficha")}
  else if(a==="emitir"){S.em=novaEm();go("emissao")}
  else if(a==="conversa"){c.conversa={data:"06/10/2026",resp:p.nome,plano:"Conversa realizada com o colaborador; revisão de rota e carga com Merchandising; reavaliação em 14 dias."};c.etapa="Ação registrada";render()}
  else if(a==="gerar"){var er=document.getElementById("emErro");
    if(!e.relato.trim()){er.textContent="Informe o relato a apurar. O campo é obrigatório.";er.hidden=false;return}
    var pts=analisar(c,e.relato);
    if(!pts.length){er.textContent="Não foi possível relacionar o relato a nenhum indicador. Descreva o fato relatado (ex.: saídas antes do horário, ruptura, pesquisas, fotos).";er.hidden=false;return}
    e.pontos=pts;e.outras=outras(c,pts);e.step=2;render();window.scrollTo(0,0)}
  else if(a==="voltar"){e.step=1;render()}
  else if(a==="revisao"){if(!revisar().ok)return;e.step=3;e.status=1;e.hist=[["Rascunho",p.nome+" – "+p.rot,"06/10/2026 09:12"],["Em revisão","Bruno Exemplo – P&P","06/10/2026 09:40"]];render();window.scrollTo(0,0)}
  else if(a==="devolver"){e.step=2;e.status=0;render()}
  else if(a==="avancar"){if(travado(c)&&e.status===1)return;e.status++;
    var quem=[null,null,"Bruno Exemplo – P&P",p.nome+" – "+p.rot,SUPS[c.sup].nome+" – Supervisor","Sistema"][e.status],hr=["","","10:15","10:42","14:05","14:06"][e.status];
    if(e.status===3)e.hash=hashDe(e.relato+e.pontos.map(function(x){return x.txt+x.conc}).join("|")+c.m);
    e.hist.push([FLUXO[e.status],quem,"06/10/2026 "+hr]);render()}
  else if(a==="novo"){S.em=novaEm();render();window.scrollTo(0,0)}});
render();
})();
</script>
