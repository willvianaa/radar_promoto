# Ambiente local. Antes de subir: copie .env.example para .env e preencha os valores.
# Sem dados reais: o banco começa vazio; o serviço migrate aplica as migrações (alembic upgrade head) antes da api e do worker.
name: radar-promotor

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # psycopg 3 (postgresql+psycopg): é o driver instalado em requirements.txt
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-desenvolvimento}
      SEGREDO_SESSAO: ${SEGREDO_SESSAO:-}
      SEGREDO_ID: ${SEGREDO_ID:-}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-desenvolvimento}
      TZ: America/Sao_Paulo

volumes:
  pgdata:
