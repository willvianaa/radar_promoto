[project]
name = "radar-promotor"
version = "0.1.0"
description = "Radar Promotor (RT Intelligence): API, worker e regras"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "radar_v2", "radar_v3", "prototipo", "ferramentas", "sistema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
