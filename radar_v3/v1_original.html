<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Radar Promotor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral fixa + topo + abas + conteúdo (padrão Monitor Regional). Escuro por padrão; claro por tema. */
:root{color-scheme:dark;
  --bg:#0B1E2D;--side:#102D42;--top:#133350;--card:#133350;--card-2:#1A3D5C;--input:#0B1E2D;--border:rgba(255,255,255,.08);--border-2:#1A3E5B;
  --ink:#FCFCFC;--ink-2:rgba(252,252,252,.66);--ink-3:rgba(252,252,252,.44);
  --rt:#F4562A;--rt-2:#D94820;--rt-bg:rgba(244,86,42,.12);--rt-line:rgba(244,86,42,.55);
  --good:#22C55E;--good-bg:rgba(34,197,94,.13);--warn:#F59E0B;--warn-bg:rgba(245,158,11,.13);--bad:#EF4444;--bad-bg:rgba(239,68,68,.13);--m2:#3B82F6;--m2-bg:rgba(59,130,246,.14);--vio:#A78BFA;--vio-bg:rgba(167,139,250,.15);
  --grid:rgba(255,255,255,.06);--paper:#F7F9FB;--paper-ink:#10263B;--paper-line:#D5DEE8;
  --radius:14px;--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#f2f5f9;--side:#ffffff;--top:#ffffff;--card:#ffffff;--card-2:#f5f8fb;--input:#ffffff;--border:#dde5ee;--border-2:#c9d5e2;
  --ink:#10263b;--ink-2:#56697e;--ink-3:#8394a6;--rt-bg:rgba(244,86,42,.09);
  --good:#16A34A;--good-bg:rgba(22,163,74,.1);--warn:#D97706;--warn-bg:rgba(217,119,6,.1);--bad:#DC2626;--bad-bg:rgba(220,38,38,.09);--m2:#2563EB;--m2-bg:rgba(37,99,235,.1);--vio:#7C3AED;--vio-bg:rgba(124,58,237,.1);--grid:rgba(16,38,59,.08);
  --paper:#ffffff;--paper-ink:#10263B;--paper-line:#D5DEE8}}
:root[data-theme="light"]{color-scheme:light;
  --bg:#f2f5f9;--side:#ffffff;--top:#ffffff;--card:#ffffff;--card-2:#f5f8fb;--input:#ffffff;--border:#dde5ee;--border-2:#c9d5e2;
  --ink:#10263b;--ink-2:#56697e;--ink-3:#8394a6;--rt-bg:rgba(244,86,42,.09);
  --good:#16A34A;--good-bg:rgba(22,163,74,.1);--warn:#D97706;--warn-bg:rgba(217,119,6,.1);--bad:#DC2626;--bad-bg:rgba(220,38,38,.09);--m2:#2563EB;--m2-bg:rgba(37,99,235,.1);--vio:#7C3AED;--vio-bg:rgba(124,58,237,.1);--grid:rgba(16,38,59,.08);
  --paper:#ffffff;--paper-ink:#10263B;--paper-line:#D5DEE8}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--top)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rt);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 16px 18px}
.brand{text-align:center;padding-bottom:20px}
.brand-logo{width:60px;height:60px;margin:0 auto 14px;border-radius:14px;background:var(--rt);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;letter-spacing:-.04em;position:relative;overflow:hidden}
.brand-logo::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,rgba(255,255,255,.35),transparent 25%);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.brand-name{font-size:15px;font-weight:700}.brand-name b{color:var(--rt)}
.brand-sub{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.side-sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 4px}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.side-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-decoration:none}
.side-nav a .n{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:1px 8px}
.side-nav a.active{background:var(--rt-bg);color:var(--ink);box-shadow:inset 3px 0 0 var(--rt);font-weight:600}
.side-nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:12px;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 70% -10%,var(--rt-bg),transparent 60%),var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;min-height:64px;background:var(--top);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top-title{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-crumb{color:var(--ink-3);font-weight:500;margin-right:2px}
.burger{display:none;border:1px solid var(--border-2);background:var(--input);border-radius:9px;width:36px;height:34px;cursor:pointer}
.theme-btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--border-2);background:var(--input);font-size:12.5px;font-weight:500;cursor:pointer}
.meta-pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--card-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.meta-pill i{width:7px;height:7px;border-radius:50%;background:var(--rt)}
.content{padding-block:16px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--ink-2);font-weight:500;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a b{font-size:10.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--border-2);border-radius:6px;padding:0 6px}
.tabs a.active{color:var(--rt);border-bottom-color:var(--rt);font-weight:600}.tabs a.active b{color:var(--rt);border-color:var(--rt-line)}
.tabs a .n{font-size:11px;font-weight:700;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:1px 8px}
/* filtros */
.filters{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px}
.f{display:grid;gap:3px;min-width:0}
.f span,.lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.f select,.f input,.inp{height:34px;border-radius:9px;border:1px solid var(--border-2);background:var(--input);padding:0 10px;min-width:0;max-width:100%}
.f.prom select{min-width:220px}
textarea.inp{height:auto;padding:10px;width:100%;line-height:1.5;resize:vertical}
.filters .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 18px;border-radius:10px;border:0;background:var(--rt);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(244,86,42,.25)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.sec{background:var(--card-2);color:var(--ink);border:1px solid var(--border-2);box-shadow:none}
.btn.ico{padding:0;width:38px}
.btn.big{height:44px;padding:0 24px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px}
/* cabeçalho de seção */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rt)}
.hero h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hero p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
/* painel automático */
.auto{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.radar{width:88px;height:88px;border-radius:50%;position:relative;background:radial-gradient(circle,transparent 0 28%,var(--rt-line) 28.5% 29.5%,transparent 30% 58%,var(--rt-line) 58.5% 59.5%,transparent 60%),var(--rt-bg);border:1px solid var(--rt-line);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(244,86,42,.55),transparent 22%);animation:sweep 3.2s linear infinite;border-radius:50%}
.radar i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--rt);box-shadow:0 0 8px var(--rt)}
.auto h2{font-size:15px;font-weight:700}
.auto h2 small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:6px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:10px}
.in{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--input);border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:13px}
.in b{font-variant-numeric:tabular-nums}
.in .dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 10px;min-width:0;display:grid;gap:2px}
.kpi-l{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.kpi-v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12px;color:var(--ink-2)}
.kpi svg{display:block;width:100%;height:30px;margin-top:6px}
/* cards e grades */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-width:0;display:grid;gap:10px;align-content:start}
.card h2{font-size:14px;font-weight:700}
.card h2 small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:6px}
.card .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g-rx{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.cv{position:relative;height:250px}
.cv.sm{height:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:560px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card-2);position:sticky;top:0;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--card-2)}
.tbl tr.hl td{background:var(--rt-bg)}
.tbl td b{white-space:nowrap}
.risk{display:flex;align-items:center;gap:8px;min-width:120px}
.risk i{flex:1;height:7px;border-radius:99px;background:var(--grid);overflow:hidden;display:block}
.risk i b{display:block;height:100%;border-radius:99px}
.risk span{font-weight:700;font-variant-numeric:tabular-nums;width:26px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-m2{background:var(--m2-bg);color:var(--m2)}.p-good{background:var(--good-bg);color:var(--good)}.p-n{background:var(--card-2);color:var(--ink-2)}.p-vio{background:var(--vio-bg);color:var(--vio)}
.t-bad{color:var(--bad);font-weight:600}.t-warn{color:var(--warn);font-weight:600}.t-good{color:var(--good);font-weight:600}.muted{color:var(--ink-2)}.small{font-size:12px}
.nobase{border:1px dashed var(--border-2);border-radius:10px;padding:12px;color:var(--ink-2);font-size:13px}
.cross{border-left:3px solid var(--vio);background:var(--vio-bg);border-radius:0 8px 8px 0;padding:8px 11px;font-size:12.5px}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:13px}.kv b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* alertas */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border-2);background:var(--input);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink)}
.chip.on{background:var(--rt-bg);border-color:var(--rt-line);color:var(--ink)}
.atype{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.at{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;gap:4px;cursor:pointer;text-align:left}
.at.on{border-color:var(--rt);box-shadow:inset 0 0 0 1px var(--rt)}
.at .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.at .l{font-size:12px;color:var(--ink-2);font-weight:600}
.at .bar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--grid)}
.feed{display:grid;gap:8px}
.al{display:grid;grid-template-columns:4px 92px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 0;cursor:pointer;overflow:hidden}
.al:hover{background:var(--card-2)}
.al .sv{align-self:stretch;border-radius:0 3px 3px 0}
.al .dt{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.al .dt b{display:block;font-size:13px;color:var(--ink)}
.al .tx{display:grid;gap:2px;min-width:0}
.al .tx b{font-size:13.5px}
.al .tx span{font-size:12.5px;color:var(--ink-2)}
.al .who{font-size:12px;color:var(--ink-3)}
.thumb{width:54px;height:42px;border-radius:7px;background:repeating-linear-gradient(135deg,var(--card-2) 0 8px,var(--input) 8px 16px);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:10px;font-weight:700}
.heat{display:flex;gap:3px;align-items:flex-end;height:54px}
.heat div{flex:1;border-radius:3px 3px 0 0;min-width:3px}
/* raio-x */
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;background:var(--rt);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 0 0 4px var(--rt-bg),0 0 0 5px var(--rt-line)}
.prof h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.gauge{width:128px;text-align:center}
.gauge svg{width:128px;height:76px;display:block}
.gauge b{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:-2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cal .d{aspect-ratio:1/0.82;border-radius:8px;background:var(--input);border:1px solid var(--border);position:relative;font-size:11px;padding:4px 6px;font-variant-numeric:tabular-nums;color:var(--ink-2);max-width:100%}
.cal .d.x{background:transparent;border-color:transparent}
.cal .d.o1{background:var(--warn-bg);border-color:var(--warn)}
.cal .d.o2{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.cal .d.fa{background:var(--bad);border-color:var(--bad);color:#fff}
.cal .d.ok{background:var(--good-bg);border-color:transparent}
.cal .d i{position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--vio)}
.cal .d em{position:absolute;left:6px;bottom:3px;font-style:normal;font-size:10px;font-weight:700;color:var(--bad)}
.tline{overflow-x:auto}
.tline svg{display:block;min-width:620px;width:100%}
.pts{display:grid;gap:6px}
.pt{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.pt .pill{flex:none}
/* dossiê */
.dos{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:36px 40px;box-shadow:0 18px 40px rgba(0,0,0,.25);display:grid;gap:14px;min-width:0}
.paper .ph-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid var(--paper-ink);padding-bottom:12px}
.paper .lg{width:40px;height:40px;border-radius:8px;background:var(--rt);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.paper h3{font-size:18px}
.paper .meta{font-size:11.5px;text-align:right;line-height:1.5}
.paper .sec{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-ink);border-bottom:1px solid var(--paper-line);padding-bottom:4px}
.paper textarea,.paper select{width:100%;border:1px solid transparent;background:transparent;color:var(--paper-ink);border-radius:6px;padding:6px 8px;line-height:1.55;resize:vertical;font-size:13.5px}
.paper textarea:hover{border-color:var(--paper-line)}
.paper textarea:focus{border-color:var(--rt);outline:none;background:rgba(244,86,42,.04)}
.paper .idt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;font-size:12.5px}
.paper .idt b{font-weight:700}
.paper .foot{font-size:10.5px;border-top:1px solid var(--paper-line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.paper .tbinfo{font-size:11.5px;opacity:.7;padding-left:8px}
.aside{display:grid;gap:12px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.chk{display:grid;gap:7px;font-size:12.5px}
.chk div{display:flex;gap:8px;align-items:flex-start}
.chk i{width:16px;height:16px;border-radius:50%;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
/* modal e config */

function gGeral(){const r=R(),W=r.semanas,lb=W.map(semLbl),c=S.cfg,m2=css("--m2"),bad=css("--bad"),good=css("--good"),warn=css("--warn"),vio=css("--vio"),rt=css("--rt");

/* ---------- Radar da operação: escopo com cada promotor como um ponto + parâmetros ---------- */
function radarPainel(){const r=R(),L=r.list,c=S.cfg,ins=insights(),R0=150,C=180;
  const gs=[...group(L,p=>p.sup||"Sem supervisor")].sort((a,b)=>a[0].localeCompare(b[0])),n=Math.max(1,gs.length),cor={D:"var(--bad)",S:"var(--vio)",M:"var(--warn)",N:"var(--good)"};
  const rad=x=>14+(100-Math.max(0,Math.min(100,x)))/100*(R0-18);
  let svg='<svg viewBox="0 0 360 360" class="scope-svg" role="img" aria-label="Radar dos promotores: quanto mais perto do centro, maior o risco">';
  svg+='<circle cx="'+C+'" cy="'+C+'" r="'+R0+'" fill="var(--good-bg)"/><circle cx="'+C+'" cy="'+C+'" r="'+rad(30)+'" fill="var(--warn-bg)"/><circle cx="'+C+'" cy="'+C+'" r="'+rad(55)+'" fill="var(--bad-bg)"/>';
  [R0,rad(30),rad(55),rad(80)].forEach(x=>svg+='<circle cx="'+C+'" cy="'+C+'" r="'+x+'" fill="none" stroke="var(--rt-line)" stroke-opacity=".45" stroke-dasharray="2 4"/>');
  svg+='<line x1="'+(C-R0)+'" x2="'+(C+R0)+'" y1="'+C+'" y2="'+C+'" stroke="var(--grid)"/><line y1="'+(C-R0)+'" y2="'+(C+R0)+'" x1="'+C+'" x2="'+C+'" stroke="var(--grid)"/>';
  [["estável",R0-8],["atenção",rad(30)-6],["crítico",rad(55)-6]].forEach(x=>svg+='<text x="'+(C+4)+'" y="'+(C-x[1])+'" font-size="8.5" font-weight="700" letter-spacing=".08em" fill="var(--ink-3)" font-family="Inter,Arial">'+x[0].toUpperCase()+'</text>');
  gs.forEach(([s,ps],gi)=>{const a0=-Math.PI/2+gi/n*2*Math.PI,a1=-Math.PI/2+(gi+1)/n*2*Math.PI,am=(a0+a1)/2;
    if(n>1)svg+='<line x1="'+C+'" y1="'+C+'" x2="'+(C+R0*Math.cos(a0)).toFixed(1)+'" y2="'+(C+R0*Math.sin(a0)).toFixed(1)+'" stroke="var(--border-2)" stroke-width="1"/>';
    const lx=C+(R0+14)*Math.cos(am),ly=C+(R0+14)*Math.sin(am),anc=Math.cos(am)>.25?"start":Math.cos(am)<-.25?"end":"middle",nm=s.split(" ")[0];
    svg+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anc+'" font-size="10.5" font-weight="700" fill="var(--ink-2)" font-family="Inter,Arial">'+esc(nm)+'</text>';
    ps.slice().sort((a,b)=>a.k<b.k?-1:1).forEach((p,i)=>{const t=(i+.5)/ps.length,a=a0+(a1-a0)*(.12+.76*t),d=rad(p.risco),x=C+d*Math.cos(a),y=C+d*Math.sin(a),sz=4+Math.min(5,p.alertas.length/5),hot=p.cls==="D"||p.cls==="S";
      svg+='<g class="blip'+(hot?" hot":"")+'" data-a="abrir" data-v="'+esc(p.k)+'" tabindex="0" role="button" aria-label="'+esc(p.nome)+', risco '+p.risco+'"><title>'+esc(p.nome)+' · risco '+p.risco+' · '+CLS[p.cls][0].toLowerCase()+'</title>'+(hot?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+sz+'" fill="none" stroke="'+cor[p.cls]+'" class="ping"/>':"")+'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+sz+'" fill="'+cor[p.cls]+'" stroke="var(--card)" stroke-width="1.5"/>'+(p.risco>=45?'<text x="'+(x+sz+3).toFixed(1)+'" y="'+(y+3).toFixed(1)+'" font-size="9.5" font-weight="700" fill="var(--ink)" font-family="Inter,Arial">'+esc(p.nome.split(" ")[0])+'</text>':"")+'</g>'})});
  const crit=L.filter(p=>p.risco>=55).length;
  svg+='<circle cx="'+C+'" cy="'+C+'" r="12" fill="var(--card)" stroke="var(--rt)" stroke-width="1.5"/><text x="'+C+'" y="'+(C+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="var(--rt)" font-family="Inter,Arial">'+crit+'</text></svg>';
  /* parâmetros */
  const sum=f=>L.reduce((a,p)=>a+f(p),0),ct=sum(p=>p.ad.lojas.reduce((a,l)=>a+l.ct,0)),rz=sum(p=>p.ad.lojas.reduce((a,l)=>a+l.rz,0)),pg=sum(p=>p.pes.prog),ex=sum(p=>p.pes.exp),tr=sum(p=>p.jor.trab),
    dc=sum(p=>p.jor.dias.filter(x=>x.n).length),au=sum(p=>p.jor.nAuto),hd=sum(p=>p.hum.dias),hn=sum(p=>p.hum.neg),fn=sum(p=>p.fotN),fs=sum(p=>p.fot.length);
  const P=[["Aderência",ct?rz/ct*100:null,c.m2,true,"meta"],["Pesquisas expiradas",pg?ex/pg*100:null,c.c.exp,false,"limite"],["Dias com ocorrência de jornada",tr?dc/tr*100:null,100-(c.c.jor||90),false,"limite"],
    ["Check-out automático",tr?au/tr*100:null,5,false,"limite"],["Humor negativo",hd?hn/hd*100:null,c.c.humPct,false,"limite"],["Fotos com indício",fn?fs/fn*100:null,2,false,"limite"]];
  const st=(v,a,up)=>v==null?"n":up?(v>=a?"good":v>=a-5?"warn":"bad"):(v<=a?"good":v<=a*1.5?"warn":"bad");
  const prm=P.map(([l,v,a,up,t])=>{const s=st(v,a,up),mx=up?100:Math.max(a*2.2,v||0,1),w=v==null?0:Math.min(100,v/mx*100),am=Math.min(100,a/mx*100);
    return'<div class="prm"><span class="led led-'+s+'"></span><div class="prm-b"><div class="prm-h"><span>'+l+'</span><b class="c-'+s+'">'+(v==null?"—":String(Math.round(v*10)/10).replace(".",",")+"%")+'</b></div><div class="prm-t"><i class="bg-'+s+'" style="width:'+w+'%"></i><em style="left:'+am+'%"></em></div><small>'+t+' '+String(a).replace(".",",")+'%'+(v==null?" · sem dados":"")+'</small></div></div>'}).join("");
  const ok=P.filter(x=>st(x[1],x[2],x[3])==="good").length,val=P.filter(x=>x[1]!=null).length;
  return'<section class="radarp"><div class="rp-head"><div><div class="eyebrow">Radar da operação</div><h2>'+(crit?plural(crit,"promotor","promotores")+" na zona crítica":"Nenhum promotor na zona crítica")+'</h2><p>Cada ponto é um promotor. Quanto mais perto do centro, maior o risco. As fatias são as equipes de cada supervisor. Clique num ponto para abrir o Raio-X.</p></div>'+
    '<div class="legend"><span><i style="background:var(--bad)"></i>Possível medida</span><span><i style="background:var(--vio)"></i>Sobrecarga</span><span><i style="background:var(--warn)"></i>Melhoria</span><span><i style="background:var(--good)"></i>Sem pontos</span></div></div>'+
    '<div class="rp-grid"><div class="scope"><div class="sweep" aria-hidden="true"></div>'+svg+'</div>'+
    '<div class="rp-side"><div class="hd"><h2>Parâmetros da operação</h2><span class="pill '+(ok===val?"p-good":ok>=val/2?"p-warn":"p-bad")+'">'+ok+' de '+val+' dentro do parâmetro</span></div><div class="prms">'+prm+'</div></div></div>'+
    '<div class="rp-ins"><h2>Leitura automática <small>gerada a partir dos dados do filtro</small></h2>'+(ins.length?'<div class="ins">'+ins.map(x=>'<div class="in"><span class="dot" style="background:'+x[0]+'"></span><span>'+x[1]+'</span></div>').join("")+'</div>':'<div class="nobase">Sem destaques para os filtros escolhidos.</div>')+'</div></section>'}

function gauge(x){const a=Math.PI*(1-x/100),cx=64,cy=66,rr=54,ex=cx+rr*Math.cos(a),ey=cy-rr*Math.sin(a);
  return'<div class="gauge"><svg viewBox="0 0 128 76" aria-hidden="true"><path d="M10 66 A54 54 0 0 1 118 66" fill="none" stroke="var(--grid)" stroke-width="11" stroke-linecap="round"/>'+(x>0?'<path d="M10 66 A54 54 0 0 1 '+ex.toFixed(1)+' '+ey.toFixed(1)+'" fill="none" stroke="'+riskCor(x)+'" stroke-width="11" stroke-linecap="round"/>':"")+'<text x="64" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="'+riskCor(x)+'" font-family="Inter,Arial">'+x+'</text></svg><b>Índice de risco</b></div>'}
function linhaTempo(p){const j=p.jor,c=S.cfg,H0=360,H1=1260,W=820,L=96,rh=22,days=j.dias,h=days.length*rh+30,X=m=>L+(Math.max(H0,Math.min(H1,m))-H0)/(H1-H0)*(W-L-10);
  let s='<svg viewBox="0 0 '+W+' '+h+'" role="img" aria-label="Check-in e check-out por dia">';
  for(let t=H0;t<=H1;t+=120)s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="18" y2="'+(h-4)+'" stroke="var(--grid)"/><text x="'+X(t)+'" y="12" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="Inter,Arial">'+fH(t)+'</text>';
  days.forEach((x,i)=>{const y=22+i*rh;s+='<text x="0" y="'+(y+13)+'" font-size="10.5" fill="var(--ink-2)" font-family="Inter,Arial">'+fDc(x.d)+' '+dow(x.d)+'</text>';
    if(p.hum.map.has(x.d))s+='<circle cx="'+(L-12)+'" cy="'+(y+9)+'" r="4" fill="'+(x.neg?"var(--vio)":"var(--good)")+'"><title>Humor '+(x.neg?"negativo":"ok")+'</title></circle>';
    s+='<rect x="'+X(p.esc.ini)+'" y="'+y+'" width="'+(X(p.esc.fim)-X(p.esc.ini))+'" height="18" rx="4" fill="var(--grid)"/>';
    x.vs.forEach(v=>{const no=/NAO OPERACIONAL/.test(norm(v.pdv)),fimv=v.auto||v.cout==null?Math.min(H1,v.cin+90):v.cout,cor=v.auto?"var(--bad)":no?"var(--ink-3)":"var(--m2)";
      s+='<rect x="'+X(v.cin)+'" y="'+(y+3)+'" width="'+Math.max(3,X(fimv)-X(v.cin))+'" height="12" rx="3" fill="'+cor+'"'+(v.auto?' opacity=".55"':"")+'><title>'+esc(v.pdv)+': '+fH(v.cin)+' – '+(v.auto?"check-out automático":fH(v.cout))+'</title></rect>'});
    if(x.atraso)s+='<path d="M'+X(x.cin)+' '+(y-1)+' l-4 -5 h8z" fill="var(--warn)"><title>Atraso de '+x.atraso+' min</title></path>';
    if(x.saida)s+='<path d="M'+X(x.cout)+' '+(y-1)+' l-4 -5 h8z" fill="var(--rt)"><title>Saída '+x.saida+' min antes</title></path>'});
  return s+'</svg>'}
function calendario(p){const ini=S.f.ini,fim=S.f.fim,jm=new Map(p.jor.dias.map(x=>[x.d,x])),fm=new Map(p.fal.list.map(x=>[x.d,x])),fo=group(p.fot,f=>f.d);
  let s='<div class="cal">'+["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>'<div class="h">'+d+'</div>').join("");
  const off=(new Date(ini+"T12:00:00").getDay()+6)%7;for(let i=0;i<off;i++)s+='<div class="d x"></div>';
  for(let d=ini;d<=fim;d=addD(d,1)){const x=jm.get(d),f=fm.get(d),nf=(fo.get(d)||[]).length,n=(x?x.n:0)+nf,cl=f?"fa":!x?"":n>=2?"o2":n?"o1":"ok";
    const tt=fD(d)+(f?" · falta "+({I:"injustificada",J:"justificada",A:"com atestado"}[f.tipo]):"")+(x?" · "+plural(x.n,"ocorrência","ocorrências")+" de jornada":"")+(nf?" · "+plural(nf,"foto suspeita","fotos suspeitas"):"")+(p.hum.map.has(d)?" · humor "+(p.hum.map.get(d)?"negativo":"ok"):"");
    s+='<div class="d '+cl+'" title="'+tt+'">'+(+d.slice(8))+(n&&!f?'<em>'+n+'</em>':"")+(p.hum.map.get(d)?'<i></i>':"")+'</div>'}

    '<h2>Bases de '+MES[+ym.slice(5)]+'/'+ym.slice(0,4)+(S.demo?' <small>(dados fictícios)</small>':"")+'</h2><div class="bases">'+Object.keys(BASES).map(b=>'<div class="base"><b>'+BASES[b]+'</b>'+(m[b]?'<span class="pill p-good" style="justify-self:start">carregada</span><span class="muted">'+m[b].n+' linhas · '+esc(m[b].arq)+'</span><span class="muted">'+esc(m[b].em)+'</span>':'<span class="pill p-n" style="justify-self:start">não carregada</span>')+'</div>').join("")+'</div>'+
    (!S.demo&&S.meses[ym]?'<div class="row"><button class="btn sec" data-a="limparMes">Apagar os dados deste mês</button><span class="small muted" id="lm-st"></span></div>':"")+'</div></div>'}
async function importar(files){const st=$("arq-st"),log=[];st.textContent="Lendo arquivos…";
  try{
    const acc={};
    for(const f of files){let res;try{res=await lerArquivo(f)}catch(e){log.push({arq:f.name,base:null,cab:"não foi possível abrir o arquivo"});continue}
      for(const r of res){if(!r.base){log.push(r);continue}const g=group(r.rows,x=>x.d.slice(0,7));
        for(const[ym,rows]of g){((acc[ym]=acc[ym]||{})[r.base]=acc[ym][r.base]||{rows:[],arq:r.arq}).rows.push(...rows)}
        log.push({arq:r.arq,aba:r.aba,base:r.base,n:r.rows.length,meses:[...g.keys()].sort().map(y=>MES[+y.slice(5)]+"/"+y.slice(0,4)).join(", ")||"nenhuma linha válida"})}}
    const yms=Object.keys(acc);
    if(yms.length){if(S.demo){S.demo=false;S.all={};S.meses={}}
      for(const ym of yms){await carregarMes(ym);for(const b in acc[ym]){st.textContent="Salvando "+BASES[b]+" de "+ym+"…";await salvarBase(ym,b,acc[ym][b].rows,acc[ym][b].arq)}}
      faixaPadrao();await carregarFaixa();S.f.uf="";S.f.sup="";S.f.pk="";S.R=null;S.pk=null;S.dos=null}
  }catch(e){S.msg="Falha ao salvar os dados ("+(e.code||e.message||"erro")+"). Os dados lidos valem só nesta sessão."}
  render();modalDados(log)}

  if(!S.dos||S.dos.k!==p.k||S.dos.per!==periodoTxt()){S.dos=montarDossie(p,"");S.dos.per=periodoTxt()}const d=S.dos,av=avisos(d),hoje=new Date();

  return'<div class="hero"><div><div class="eyebrow">Emissão</div><h2>Dossiê do Promotor</h2><p>O texto é montado com os dados do filtro e pode ser editado direto na folha. Ao emitir, o sistema gera o PDF formal numerado; o Excel traz os dados completos.</p></div></div>'+
  '<div class="dos"><div class="paper" id="paper">'+
    '<div class="ph-top"><div class="row" style="gap:12px;flex-wrap:nowrap"><div class="lg">rt</div><div><h3>Dossiê do Promotor</h3><div style="font-size:12px">RT Representações e Merchandising</div></div></div><div class="meta">'+(d.num?"Documento nº <b>"+d.num+"</b>":"Nº gerado na emissão")+'<br>Emissão: '+p2(hoje.getDate())+'/'+p2(hoje.getMonth()+1)+'/'+hoje.getFullYear()+'<br><b>Confidencial – uso interno</b></div></div>'+
    '<div class="sec">1. Identificação</div><div class="idt"><span><b>Nome:</b> '+esc(p.nome)+'</span><span><b>CPF:</b> '+esc(p.mat||"não informado")+'</span><span><b>Vínculo:</b> '+esc(p.vinc||"não informado")+'</span><span><b>UF:</b> '+esc(p.uf||"—")+'</span><span><b>Supervisor:</b> '+esc(p.sup||"—")+'</span><span><b>Escala:</b> '+fH(p.esc.ini)+' às '+fH(p.esc.fim)+'</span><span style="grid-column:1/-1"><b>Lojas:</b> '+esc(p.lojas.join("; ")||"—")+'</span><span><b>Período:</b> '+periodoTxt()+'</span></div>'+
    '<div class="sec">2. Objeto</div><textarea id="d-objeto" data-d="objeto" rows="2">'+esc(d.objeto)+'</textarea>'+
    '<div class="sec">3. Síntese dos achados</div><textarea id="d-sint" data-d="sint" rows="'+Math.max(4,d.sint.split("\n").length+1)+'">'+esc(d.sint)+'</textarea>'+
    (d.blocos.length?'<div class="sec">4. Achados</div>'+d.blocos.map((b,i)=>'<div style="display:grid;gap:4px"><b style="font-size:13px">4.'+(i+1)+' '+esc(b.tit)+(b.rel?" · ponto do relato":"")+'</b>'+(b.rel?'<select id="d-conc'+i+'" data-conc="'+i+'" aria-label="Conclusão do ponto" style="max-width:320px;border:1px solid var(--paper-line)">'+CONC.map((c,x)=>'<option value="'+x+'"'+(b.conc===x?" selected":"")+'>'+c+'</option>').join("")+'</select>':"")+'<textarea id="d-b'+i+'" data-b="'+i+'" rows="4">'+esc(b.txt)+'</textarea>'+(b.tab&&b.tab.r.length?'<span class="tbinfo">Tabela no PDF: '+b.tab.r.length+' linha(s) · '+esc(b.tab.h.join(", "))+'</span>':"")+'</div>').join(""):'<div class="tbinfo">Nenhum desvio encontrado no período.</div>')+
    '<div class="sec">'+(d.blocos.length?5:4)+'. Considerações finais</div><textarea id="d-fim" data-d="fim" rows="5">'+esc(d.fim)+'</textarea>'+
    '<div class="foot"><span>'+(d.num||"RP-AAAA-NNNNNN")+'</span><span>Este relatório apresenta indícios baseados em registros operacionais.</span><span>Página 1</span></div></div>'+
  '<div class="aside"><section class="card"><h2>Promotor</h2><select class="inp" id="d-p" aria-label="Promotor do dossiê">'+r.base.slice().sort((a,b)=>b.risco-a.risco).map(x=>'<option value="'+esc(x.k)+'"'+(x.k===p.k?" selected":"")+'>'+esc(x.nome)+' · risco '+x.risco+'</option>').join("")+'</select><div class="row">'+clsPill(p)+'</div>'+riskBar(p.risco)+
    '<button class="btn big" data-a="emitir">'+IC.doc+'Emitir dossiê</button><button class="btn sec" data-a="xlsx">Baixar Excel</button><div id="d-st" class="small muted"></div></section>'+
    '<section class="card"><h2>Relato a apurar <small>opcional</small></h2><textarea class="inp" id="d-relato" rows="3" placeholder="Ex.: supervisão relata saídas antes do horário e ruptura informada sem fundamento na loja X.">'+esc(d.relato)+'</textarea><button class="btn sec" data-a="aplicarRelato">Refazer texto com o relato</button><small class="muted">Refazer descarta as edições da folha.</small></section>'+
    '<section class="card"><h2>Conferência do texto</h2><div class="chk" id="d-av">'+chk.map(x=>'<div><i style="background:'+(x[1]?"var(--good)":"var(--bad)")+'">'+(x[1]?"✓":"!")+'</i><span>'+x[0]+'</span></div>').join("")+'</div></section></div></div>'}
function atualizarChk(){const d=S.dos,av=avisos(d),el=$("d-av");if(!el)return;const chk=[["Sem saudação de e-mail",!av.some(a=>/saudação/.test(a))],["Sem termos acusatórios",!av.some(a=>/acusatório/.test(a))],["Sem nomes de sistemas",!av.some(a=>/sistema/.test(a))],["Considerações iniciam com “Sendo assim,”",/^sendo assim,/i.test(d.fim.trim())],["Até 5 blocos de achados",d.blocos.length<=5]];
  el.innerHTML=chk.map(x=>'<div><i style="background:'+(x[1]?"var(--good)":"var(--bad)")+'">'+(x[1]?"✓":"!")+'</i><span>'+x[0]+'</span></div>').join("")}

/* =====================================================================
   9. EVENTOS
   ===================================================================== */
function rota(){const h=location.hash.replace("#","");S.view=VIEWS.some(v=>v[0]===h)||h==="config"?h:"geral";$("side").classList.remove("open");render()}
function ir(v){if(location.hash==="#"+v){S.view=v;render()}else location.hash=v;window.scrollTo(0,0)}
window.addEventListener("hashchange",rota);
$("burger").addEventListener("click",()=>$("side").classList.toggle("open"));
$("scrim").addEventListener("click",()=>$("side").classList.remove("open"));
$("theme").addEventListener("click",()=>{const el=document.documentElement,cur=el.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),nx=cur==="dark"?"light":"dark";el.dataset.theme=nx;try{localStorage.setItem("rp-tema",nx)}catch(e){}renderView()});
try{const t=localStorage.getItem("rp-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>renderView());
async function pesquisar(){const v=id=>($("f-"+id)||{}).value||"";let ini=v("ini"),fim=v("fim");if(ini&&fim&&ini>fim){const t=ini;ini=fim;fim=t}
  S.f.reg=v("reg");S.f.uf=v("uf");S.f.sup=v("sup");S.f.pk=v("pk");if(ini)S.f.ini=ini;if(fim)S.f.fim=fim;S.f.ano=v("ano")||S.f.ano;S.pk=S.f.pk||null;S.dos=null;S.alN=60;
  S.load=true;S.R=null;renderBanner();await carregarFaixa();S.load=false;S.R=null;render()}
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.dataset.d&&S.dos){S.dos[t.dataset.d]=t.value;atualizarChk()}
  else if(t.dataset.b!=null&&S.dos){S.dos.blocos[+t.dataset.b].txt=t.value;atualizarChk()}
  else if(t.id==="d-relato"&&S.dos){S.dos.relato=t.value}});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="arq"){if(t.files.length)importar([...t.files]);return}
  if(t.dataset.conc!=null&&S.dos){S.dos.blocos[+t.dataset.conc].conc=+t.value;return}
  if(t.id==="f-ano"){const ms=Object.keys(S.meses).filter(y=>y.slice(0,4)===t.value).sort();if(ms.length){$("f-ini").value=ms[0]+"-01";$("f-fim").value=fimMes(ms[ms.length-1])}return}
  if(t.id==="f-uf"||t.id==="f-reg"){return}
  if(t.id==="rx-p"||t.id==="d-p"){S.pk=t.value;S.dos=null;renderView();return}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.matches("tr.click,.al[data-a]"))ev.target.click();if(ev.key==="Enter"&&ev.target.closest&&ev.target.closest("#filters")&&ev.target.tagName!=="BUTTON")pesquisar();if(ev.key==="Escape")$("modal").innerHTML=""});
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(ev.target.closest("a[href^='http']"))return;
  if(a==="fecharModalFora"){if(ev.target===b)$("modal").innerHTML="";return}
  if(a==="pesquisar")pesquisar();
  else if(a==="ir")ir(v);
  else if(a==="abrir"){S.pk=v;S.dos=null;ir("raio-x")}
  else if(a==="levar"){S.dos=null;ir("dossie")}
  else if(a==="alTipo"){S.al.tipo=S.al.tipo===v?"":v;S.alN=60;renderView()}
  else if(a==="alSev"){S.al.sev=v;S.alN=60;renderView()}
  else if(a==="alMais"){S.alN=(S.alN||60)+60;renderView()}
  else if(a==="dados")modalDados();
  else if(a==="fecharModal")$("modal").innerHTML="";
  else if(a==="fecharMsg"){S.msg="";renderBanner()}
  else if(a==="limparMes"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Confirmar: apagar este mês";return}
    $("lm-st").textContent="Apagando…";try{await limparMes(ymAtual())}catch(e){S.msg="Não foi possível apagar tudo ("+(e.code||"erro")+")."}
    if(!Object.keys(S.meses).length){S.demo=true;demo()}faixaPadrao();await carregarFaixa();S.R=null;S.pk=null;S.dos=null;$("modal").innerHTML="";render()}
  else if(a==="aplicarRelato"){const num=S.dos.num;S.dos=montarDossie(pessoa(),$("d-relato").value);S.dos.num=num;S.dos.per=periodoTxt();renderView()}
  else if(a==="emitir"||a==="xlsx"){const st=$("d-st");b.disabled=true;st.textContent="Gerando o arquivo…";
    try{const f=a==="emitir"?await gerarPDF():await gerarExcel(),ok=await baixar(f.nome,f.data);st.textContent=ok?"Arquivo gerado: "+f.nome:"Download cancelado."}catch(e){st.textContent="Não foi possível gerar o arquivo ("+(e.message||e.code||"erro")+")."}
    b.disabled=false;const m=document.querySelector(".paper .meta");if(m&&S.dos.num)m.innerHTML=m.innerHTML.replace("Nº gerado na emissão","Documento nº <b>"+S.dos.num+"</b>")}
  else if(a==="cfgSalvar"){lerConfig();S.R=null;S.dos=null;await salvarCfg();render();$("c-msg").textContent="Configurações salvas"+(db?".":" (valem só nesta sessão).")}
  else if(a==="cfgPadrao"){const ep=S.cfg.escP;S.cfg=JSON.parse(JSON.stringify(CFG0));S.cfg.escP=ep;S.R=null;await salvarCfg();render();$("c-msg").textContent="Padrão restaurado."}
  else if(a==="escAdd"){const i=tOut($("c-pini").value),f=tOut($("c-pfim").value);if(i!=null&&f!=null&&f>i){const k=$("c-pk").value;lerConfig();S.cfg.escP[k]={ini:i,fim:f};S.R=null;await salvarCfg();render()}}
  else if(a==="escDel"){lerConfig();delete S.cfg.escP[v];S.R=null;await salvarCfg();render()}});

/* =====================================================================
   10. INÍCIO
   ===================================================================== */
demo();faixaPadrao();rota();iniciarBase();
window.addEventListener("load",()=>{if(window.Chart)renderView()});
})();
</script>
