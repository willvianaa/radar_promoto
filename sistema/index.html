<style>
/* Layout: barra lateral fixa + topo + conteúdo (padrão Monitor Regional). Escuro por padrão; claro por tema. */
:root{color-scheme:dark;
  --bg:#0B1E2D;--side:#102D42;--top:#133350;--card:#133350;--card-2:#1A3D5C;--input:#0B1E2D;--border:rgba(255,255,255,.08);--border-2:#1A3E5B;
  --ink:#FCFCFC;--ink-2:rgba(252,252,252,.62);--ink-3:rgba(252,252,252,.42);
  --rt:#F4562A;--rt-2:#D94820;--rt-bg:rgba(244,86,42,.12);--rt-line:rgba(244,86,42,.55);
  --good:#22C55E;--good-bg:rgba(34,197,94,.13);--warn:#F59E0B;--warn-bg:rgba(245,158,11,.13);--bad:#EF4444;--bad-bg:rgba(239,68,68,.13);--m2:#3B82F6;--m2-bg:rgba(59,130,246,.14);
  --grid:rgba(255,255,255,.06);--radius:14px;--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#f2f5f9;--side:#ffffff;--top:#ffffff;--card:#ffffff;--card-2:#f5f8fb;--input:#ffffff;--border:#dde5ee;--border-2:#c9d5e2;
  --ink:#10263b;--ink-2:#56697e;--ink-3:#8394a6;--rt-bg:rgba(244,86,42,.09);
  --good:#16A34A;--good-bg:rgba(22,163,74,.1);--warn:#D97706;--warn-bg:rgba(217,119,6,.1);--bad:#DC2626;--bad-bg:rgba(220,38,38,.09);--m2:#2563EB;--m2-bg:rgba(37,99,235,.1);--grid:rgba(16,38,59,.08)}}
:root[data-theme="light"]{color-scheme:light;
  --bg:#f2f5f9;--side:#ffffff;--top:#ffffff;--card:#ffffff;--card-2:#f5f8fb;--input:#ffffff;--border:#dde5ee;--border-2:#c9d5e2;
  --ink:#10263b;--ink-2:#56697e;--ink-3:#8394a6;--rt-bg:rgba(244,86,42,.09);
  --good:#16A34A;--good-bg:rgba(22,163,74,.1);--warn:#D97706;--warn-bg:rgba(217,119,6,.1);--bad:#DC2626;--bad-bg:rgba(220,38,38,.09);--m2:#2563EB;--m2-bg:rgba(37,99,235,.1);--grid:rgba(16,38,59,.08)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--top)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rt);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:30px 16px 18px}
.brand{text-align:center;padding-bottom:22px}
.brand-logo{width:60px;height:60px;margin:0 auto 16px;border-radius:14px;background:var(--rt);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;letter-spacing:-.04em}
.brand-name{font-size:15px;font-weight:700}.brand-name b{color:var(--rt)}
.brand-sub{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.side-sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 4px}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.side-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-decoration:none}
.side-nav a.active{background:var(--rt-bg);color:var(--ink);box-shadow:inset 3px 0 0 var(--rt);font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:12px;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 70% -10%,var(--rt-bg),transparent 60%),var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;min-height:64px;background:var(--top);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top-title{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-crumb{color:var(--ink-3);font-weight:500;margin-right:2px}
.burger{display:none;border:1px solid var(--border-2);background:var(--input);border-radius:9px;width:36px;height:34px;cursor:pointer}
.theme-btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--border-2);background:var(--input);font-size:12.5px;font-weight:500;cursor:pointer}
.meta-pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--card-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.meta-pill i{width:7px;height:7px;border-radius:50%;background:var(--rt)}
.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.filters{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px}
.f{display:grid;gap:3px;min-width:0}
.f span,.lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.f select,.f input,.inp{height:34px;border-radius:9px;border:1px solid var(--border-2);background:var(--input);padding:0 10px;min-width:0;max-width:100%}
textarea.inp{height:auto;padding:10px;width:100%;line-height:1.5;resize:vertical}
.filters .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 18px;border-radius:10px;border:0;background:var(--rt);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(244,86,42,.25)}
.btn.sec{background:var(--card-2);color:var(--ink);border:1px solid var(--border-2);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 14px;min-width:0}
.kpi-l{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.kpi-v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12px;color:var(--ink-2);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-width:0;display:grid;gap:10px;align-content:start}
.card h2{font-size:14px;font-weight:700}
.card h2 small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:560px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card-2);position:sticky;top:0;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--card-2)}
.tbl tr.hl td{background:var(--rt-bg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-m2{background:var(--m2-bg);color:var(--m2)}.p-good{background:var(--good-bg);color:var(--good)}.p-n{background:var(--card-2);color:var(--ink-2)}
.t-bad{color:var(--bad);font-weight:600}.t-warn{color:var(--warn);font-weight:600}.muted{color:var(--ink-2)}.small{font-size:12px}
.nobase{border:1px dashed var(--border-2);border-radius:10px;padding:12px;color:var(--ink-2);font-size:13px}
.cross{border-left:3px solid var(--m2);background:var(--m2-bg);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12.5px}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:13px}.kv b{color:var(--ink);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}.stats b{font-variant-numeric:tabular-nums}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ph{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card-2)}
.ph .img{height:96px;background:repeating-linear-gradient(135deg,var(--card) 0 12px,var(--card-2) 12px 24px);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px}
.ph .cap{padding:9px 11px;font-size:12px;display:grid;gap:3px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal .box{background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);padding:18px;width:min(760px,100%);display:grid;gap:14px}
.bases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.base{border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12.5px;display:grid;gap:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.doc-sec{display:grid;gap:6px}
.bars{display:grid;gap:5px}.bars div{display:grid;grid-template-columns:56px 1fr 48px;gap:8px;align-items:center;font-size:12px}
.bars i{display:block;height:12px;background:var(--grid);border-radius:3px;overflow:hidden}.bars i b{display:block;height:100%;background:var(--rt)}
.scrim{display:none}
@media (max-width:880px){
  .side{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .22s;width:250px;padding-top:calc(30px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}.side.open+.scrim{display:block;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5)}
  .burger{display:block}.top-crumb,.meta-pill{display:none}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .filters{display:grid;grid-template-columns:1fr 1fr}.filters .sp{display:none}.filters .wide{grid-column:1/-1}
  .grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi-v{font-size:24px}
}
</style>

</div>

const CHAVES=[["jor",/sa[ií]da|hor[áa]rio|jornada|atras|check|almo[çc]o|ocios/],["pes",/pesquisa|respond|expirad|atividade/],["ad",/ader[êe]ncia|visita/],["fal",/falt|aus[êe]n|atestado/],["fot",/foto|imagem/],["rup",/ruptura|estoque/]];
function montarDossie(p,relato){const B=blocos(p),t=(relato||"").toLowerCase(),rel=t.trim()?CHAVES.filter(c=>c[1].test(t)).map(c=>c[0]):[];

    try{const f=a==="pdf"?await gerarPDF():await gerarExcel(),ok=await baixar(f.nome,f.data);st.textContent=ok?"Arquivo gerado: "+f.nome:"Download cancelado."}catch(e){st.textContent="Não foi possível gerar o arquivo ("+(e.message||e.code||"erro")+")."}
    b.disabled=false;const sm=document.querySelector("#view .small.muted");if(sm&&S.dos.num)sm.textContent=pessoa().nome+" · "+periodoTxt()+" · nº "+S.dos.num}
  else if(a==="cfgSalvar"){lerConfig();S.R=null;S.dos=null;await salvarCfg();render();$("c-msg").textContent="Configurações salvas"+(db?".":" (valem só nesta sessão).")}
  else if(a==="cfgPadrao"){const ep=S.cfg.escP;S.cfg=JSON.parse(JSON.stringify(CFG0));S.cfg.escP=ep;S.R=null;await salvarCfg();render();$("c-msg").textContent="Padrão restaurado."}
  else if(a==="escAdd"){const i=tOut($("c-pini").value),f=tOut($("c-pfim").value);if(i!=null&&f!=null&&f>i){const k=$("c-pk").value;lerConfig();S.cfg.escP[k]={ini:i,fim:f};S.R=null;await salvarCfg();render()}}
  else if(a==="escDel"){lerConfig();delete S.cfg.escP[v];S.R=null;await salvarCfg();render()}});

/* =====================================================================
   10. INÍCIO
   ===================================================================== */
demo();rota();iniciarBase();
})();
</script>
