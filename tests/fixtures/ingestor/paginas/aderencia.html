<!doctype html><meta charset="utf-8"><title>Aderência (simulado)</title>
<select name="grupo"><option>Todos</option><option>DESCONTOS</option></select>
<select name="mes"><option value="1" selected>1</option><option>10</option><option>11</option></select>
<select name="ano"><option value="2026" selected>2026</option></select>
<button id="atualizar" onclick="window.__proibido = true">Atualizar Aderência</button>
<button id="gerar" onclick="window.__proibido = true">Gerar Aderência</button>
<button id="exp" onclick="exportar()">Exportar XLSX</button>
<div id="dlg" role="dialog" hidden>Recalcular aderência? <button onclick="window.__recalcular = 'confirmado'">Recalcular</button>
  <button onclick="document.getElementById('dlg').hidden = true; window.__recalcular = 'cancelado'">Cancelar</button></div>
<script>
function exportar() {
  const q = ['grupo','mes','ano'].map(n => n + '=' + document.querySelector('[name=' + n + ']').value).join('&');
  document.getElementById('dlg').hidden = false;
  location.href = '/download/aderencia?' + q;
}
</script>
